<script>const page=productDemo.getPage("suppliers");page.querySelector('[data-select-all]').onchange=event=>{page.querySelectorAll('tbody input[type=checkbox]').forEach(input=>input.checked=event.target.checked);};page.querySelector('[data-reset]').onclick=()=>{page.querySelectorAll('.mp-filters input').forEach(input=>input.value='');page.querySelectorAll('.mp-filters select').forEach(select=>select.selectedIndex=0);};page.querySelectorAll('[data-menu]').forEach(button=>{if(button.dataset.menu==='操作日志')button.onclick=()=>{const menu=page.querySelector('.mp-submenu');menu.hidden=!menu.hidden;};else button.disabled=true;});</script>
