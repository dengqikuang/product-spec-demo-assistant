        line.setAttribute("d", path);
        icon.append(line);
        return icon;
      };
      const hydrateIcons = (root = document) => {
        const hosts = [...(root.matches?.("[data-demo-icon]") ? [root] : []), ...root.querySelectorAll("[data-demo-icon]")];
        for (const host of hosts) {
          const name = host.dataset.demoIcon;
          if (!Object.hasOwn(DEMO_ICONS, name)) {
            host.dataset.iconError = name;
            continue; // One invalid icon must not prevent the rest of the page from starting.
          }
          delete host.dataset.iconError;
          if (host.dataset.iconReady === name && host.querySelector("svg.demo-icon path")) continue;
          host.replaceChildren(createIcon(name));
          host.dataset.iconReady = name;
        }
      };
      const addIconText = (button, iconName, text) => {
        const label = document.createElement("span");
        label.textContent = text;
        button.append(createIcon(iconName), label);
      };
/* INCLUDE:MALL_RUNTIME */
      if (pageById.size !== config.pages.length) throw new Error("DEMO_CONFIG.pages.id 不得重复");
      for (const page of config.pages) {
        const panel = $("[data-page-panel=\"" + CSS.escape(page.id) + "\"]");
        if (!panel) throw new Error(`配置页面 ${page.id} 缺少对应 data-page-panel`);
        const width = Number(page.viewport?.width);
        const height = Number(page.viewport?.height);
        if (width > 0) panel.style.width = `${width}px`;
        if (height > 0) { panel.style.height = `${height}px`; panel.style.minHeight = `${height}px`; }
        panel.dataset.state = "default";
        panel.dataset.surface = page.surface;
        if (page.surface === "mall-admin") renderMallAdminShell(page.id);
      }

      document.title = config.title || "需求原型";
      $("#coverTitle").textContent = config.title || "需求原型";
      $("#demoTitle").textContent = config.title || "需求原型";
      $("#overviewSummary").textContent = config.overview || "";
      const createNavGroup = (title) => {
        const group = document.createElement("section");
        group.className = "nav-group";
        group.setAttribute("aria-label", title);
        const heading = document.createElement("h3");
        heading.className = "nav-group-title";
        heading.textContent = title;
        group.appendChild(heading);
        return group;
      };
      const pageGroupTitle = (page) => page.surface === "mobile"
        ? ({ app: "APP", h5: "H5", "mini-program": "小程序" }[page.terminal] || "移动端")
        : page.systemName || (page.surface === "mall-admin" ? "商城后台" : "后台");
      const pageGroups = new Map();
      for (const page of config.pages) {
        const groupTitle = pageGroupTitle(page);
        if (!pageGroups.has(groupTitle)) {
          const group = createNavGroup(groupTitle);
          pageGroups.set(groupTitle, group);
          $("#overviewNav").appendChild(group);
        }
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.pageTarget = page.id;
        const label = document.createElement("strong");
        const summary = document.createElement("small");
        label.textContent = page.label || page.id;
        summary.textContent = page.overview || "";
        button.append(label, summary);
        pageGroups.get(groupTitle).appendChild(button);
      }

      let businessFlowButton = null;
      if (hasBusinessFlow) {
        businessFlowButton = document.createElement("button");
        businessFlowButton.type = "button";
        businessFlowButton.dataset.businessFlowTarget = "true";
        const businessFlowLabel = document.createElement("strong");
        const businessFlowSummary = document.createElement("small");
        businessFlowLabel.textContent = "业务流程概览";
        businessFlowSummary.textContent = config.businessFlow.title;
        businessFlowButton.append(businessFlowLabel, businessFlowSummary);
        const flowGroup = createNavGroup("方案概览");
        flowGroup.appendChild(businessFlowButton);
        $("#overviewNav").prepend(flowGroup);
      }

      const renderBusinessFlow = () => {
        const root = $("#businessFlowPanel");
        const flow = config.businessFlow;
        root.replaceChildren();
        const flows = Array.isArray(flow?.flows) ? flow.flows : flow?.stages?.length ? [flow] : [];
        if (!flow || flow.status === "placeholder" || !flows.length) {
          const empty = document.createElement("div");
          empty.className = "business-flow-placeholder";
          const title = document.createElement("strong");
          const detail = document.createElement("span");
          title.textContent = "业务流程概览待补充";
          detail.textContent = "完成需求澄清后，按业务阶段、动作角色与系统留痕填入本图。";
          empty.append(title, detail);
          root.appendChild(empty);
          return;
        }
        const el = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };
        const header = el("header", "business-flow-header");
        const heading = el("div", "business-flow-heading");
        heading.append(el("p", "business-flow-eyebrow", "方案概览 · 端到端业务流程"));
        heading.append(el("h3", "", flow.title));
        heading.append(el("p", "business-flow-summary", flow.summary));
        header.appendChild(heading);
        root.appendChild(header);

        const legend = el("div", "business-flow-legend");
        legend.append(el("span", "flow-legend-title", "三层泳道"));
        legend.append(el("span", "", "横向：业务流程"));
        legend.append(el("span", "", "纵向：行为动作与系统留痕"));
        legend.append(el("span", "flow-mode online", "线上 · 标明系统/终端"));
        legend.append(el("span", "flow-mode offline", "线下 · 标明现场/外部环节"));
        root.appendChild(legend);

        const roleColors = new Map();
        const roleClass = (role) => {
          if (!roleColors.has(role)) roleColors.set(role, roleColors.size % 5);
          return `tone-${roleColors.get(role)}`;
        };
        for (const [flowIndex, currentFlow] of flows.entries()) {
        const section = el("section", "business-flow-section");
        if (Array.isArray(flow.flows)) section.append(el("h4", "business-flow-section-title", `${flowIndex + 1}. ${currentFlow.title}`));
        const board = el("div", "business-flow-board");
        board.style.setProperty("--flow-stages", String(currentFlow.stages.length));
        const makeRow = (title, hint) => {
          const row = el("div", "business-flow-row");
          const rowLabel = el("div", "business-flow-row-label");
          rowLabel.append(el("strong", "", title), el("small", "", hint));
          row.appendChild(rowLabel);
          return row;
        };
        const processRow = makeRow("业务流程", "方案支持的完整链路 →");
        const actionRow = makeRow("行为动作", "每项动作都标角色与发生位置");
        const recordRow = makeRow("系统留痕", "业务记录与示意数据");
        for (const [index, stage] of currentFlow.stages.entries()) {
          const processCell = el("div", "business-flow-cell business-flow-stage");
          processCell.append(el("strong", "", `${index + 1}. ${stage.label}`));
          processCell.append(el("small", "", stage.summary));
          processRow.appendChild(processCell);

          const actionCell = el("div", "business-flow-cell");
          const actionList = el("div", "business-flow-action-list");
          for (const action of stage.actions || []) {
            const card = el("div", "business-flow-action");
            const meta = el("div", "business-flow-action-meta");
            const kindLabel = action.kind === "trigger" ? "触发者" : "执行者";
            meta.append(el("span", `flow-role ${roleClass(action.role)}`, `${kindLabel}：${action.role}`));
            const place = action.mode === "online" ? `线上 · ${action.system}` : `线下 · ${action.location}`;
            meta.append(el("span", `flow-mode ${action.mode}`, place));
            card.append(meta, el("div", "business-flow-action-text", action.text));
            if (action.condition) card.append(el("small", "business-flow-condition", `条件：${action.condition}`));
            actionList.appendChild(card);
          }
          actionCell.appendChild(actionList);
          actionRow.appendChild(actionCell);

          const recordCell = el("div", "business-flow-cell");
          const recordList = el("div", "business-flow-record-list");
          if (stage.records?.length) {
            for (const record of stage.records) {
              const card = el("div", "business-flow-record");
              card.append(el("strong", "", record.name), el("small", "", record.sampleData));
              recordList.appendChild(card);
            }
          } else recordList.appendChild(el("span", "business-flow-empty", "本阶段无新增系统留痕"));
          recordCell.appendChild(recordList);
          recordRow.appendChild(recordCell);
        }
        board.append(processRow, actionRow, recordRow);
        section.appendChild(board);
        root.appendChild(section);
        }
        const foot = el("div", "business-flow-foot");
        foot.append(el("span", "", "先从左到右读完整流程，再在每个阶段查看动作角色、线上/线下入口与记录。"));
        root.appendChild(foot);
      };
      if (hasBusinessFlow) renderBusinessFlow();

      const renderNotes = (pageId) => {
        const page = pageById.get(pageId);
        const panel = $("[data-page-panel=\"" + CSS.escape(pageId) + "\"]");
        const state = page?.states?.find((item) => item.id === navigation.states.get(pageId));
        const meta = { ...page?.notes, ...state?.notes };
        $("#notesPanel").dataset.pageId = pageId;
        $("#notesTitle").textContent = page.label || pageId;
        $("#notesDescription").textContent = meta.description || "";
        $("#notesResult").textContent = meta.result || "";
        $("#notesBoundary").textContent = meta.boundary || "";
        const root = $("#notesRules");
        root.replaceChildren();
        const groups = [...(page.notes?.groups || []), ...(state?.notes?.groups || [])];
        const refs = [...new Set([...(page.notes?.specRefs || []), ...(state?.notes?.specRefs || [])])];
        for (const ref of refs) {
          const section = config.specSections?.[ref];
          if (!section) throw new Error(`未知 Spec 章节：${ref}`);
          groups.push({ title: `Spec · ${section.title}`, items: section.items });
        }
        for (const group of groups) {
          const section = document.createElement("section");
          const heading = document.createElement("h4");
          const list = document.createElement("ul");
          heading.textContent = group.title || "业务规则";
          for (const item of group.items || []) {
            const li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
          }
          section.append(heading, list);
          root.appendChild(section);
        }
      };

      const renderBusinessFlowNotes = () => {
        const flow = config.businessFlow || {};
        $("#notesPanel").dataset.pageId = businessFlowPageId;
        $("#notesTitle").textContent = "业务流程概览";
        $("#notesDescription").textContent = flow.summary || "展示本需求所服务的端到端业务场景。";
        $("#notesResult").textContent = flow.outcome || "业务流程及结果待补充。";
        $("#notesBoundary").textContent = flow.boundary || "图中业务记录与示意数据不代表物理数据库实现。";
        const root = $("#notesRules");
        root.replaceChildren();
        const section = document.createElement("section");
        const heading = document.createElement("h4");
        const list = document.createElement("ul");
        heading.textContent = "图示说明";
        const items = [
          "横向按发生顺序呈现方案支持的完整业务流程。",
          "行为动作逐项标明触发者或执行者；线上动作标注系统/终端，线下动作标注现场或外部环节。",
          "系统留痕展示业务记录名称与示意数据；不要据此推断未确认的物理表结构。",
          ...(flow.readingRules || [])
        ];
        for (const item of items) {
          const li = document.createElement("li");
          li.textContent = item;
          list.appendChild(li);
        }
        section.append(heading, list);
        root.appendChild(section);
      };

      const showBusinessFlow = () => {
        if (!hasBusinessFlow) return;
        navigation.page = businessFlowPageId;
        $("#businessFlowPanel").hidden = false;
        for (const panel of $$("[data-page-panel]")) panel.hidden = true;
        for (const button of $$("#overviewNav [data-page-target]")) button.setAttribute("aria-current", "false");
        businessFlowButton.setAttribute("aria-current", "page");
        renderBusinessFlowNotes();
        $("#prototypeContent").scrollTo(0, 0);
      };

      const showPage = (pageId) => {
        if (!pageById.has(pageId)) throw new Error(`未知页面：${pageId}`);
        navigation.page = pageId;
        $("#businessFlowPanel").hidden = true;
        for (const panel of $$("[data-page-panel]")) panel.hidden = panel.dataset.pagePanel !== navigation.page;
        businessFlowButton?.setAttribute("aria-current", "false");
        for (const button of $$("[data-page-target]")) button.setAttribute("aria-current", button.dataset.pageTarget === pageId ? "page" : "false");
        renderNotes(pageId);
        $("#prototypeContent").scrollTo(0, 0);
      };
      const setSide = (side, visible) => {
        const isOverview = side === "overview";
        const button = $(isOverview ? "#toggleOverview" : "#toggleNotes");
        $("#app").classList.toggle(isOverview ? "hide-overview" : "hide-notes", !visible);
        button.setAttribute("aria-pressed", String(visible));
        button.textContent = `${isOverview ? "概述" : "说明"}：${visible ? "显示" : "隐藏"}`;
      };
      const setPageState = (pageId, stateId) => {
        const page = pageById.get(pageId);
        if (!page?.states?.some((state) => state.id === stateId)) throw new Error(`未声明的页面状态：${pageId}/${stateId}`);
        const panel = $("[data-page-panel=\"" + CSS.escape(pageId) + "\"]");
        navigation.states.set(pageId, stateId);
        panel.dataset.state = stateId;
        if (navigation.page === pageId) renderNotes(pageId);
      };
      // Runtime checks complement source checks: CSS and dynamically-created DOM matter too.
      const audit = () => {
        const errors = [];
        const panels = $$("[data-page-panel]");
        const flowPanel = $("#businessFlowPanel");
        for (const panel of panels) {
          hydrateIcons(panel);
          for (const host of $$("[data-demo-icon]", panel)) {
            if (host.dataset.iconError || !host.querySelector("svg.demo-icon path")) errors.push(`${panel.dataset.pagePanel}: 图标缺失或未知 ${host.dataset.demoIcon}`);
          }
          for (const button of $$("button", panel)) {
            if (!button.textContent.trim() && !button.getAttribute("aria-label")?.trim() && !button.getAttribute("aria-labelledby")) errors.push(`${panel.dataset.pagePanel}: 纯图标按钮缺少名称`);
          }
        }
        for (const id of requiredIds) if (document.querySelectorAll(`[id="${id}"]`).length !== 1) errors.push(`外框 ID 重复或缺失: ${id}`);
        if (panels.length !== config.pages.length) errors.push("页面数量与配置不同");
        const visiblePanels = panels.filter((panel) => !panel.hidden);
        if (hasBusinessFlow && navigation.page === businessFlowPageId) {
          if (visiblePanels.length || flowPanel.hidden) errors.push("业务流程概览必须独占中栏");
          const selected = $$("#overviewNav [aria-current='page']");
          if (selected.length !== 1 || selected[0] !== businessFlowButton || $("#notesPanel").dataset.pageId !== businessFlowPageId || $("#notesTitle").textContent !== "业务流程概览") errors.push("业务流程概览三栏导航或说明未同步");
        } else {
          if (visiblePanels.length !== 1 || !flowPanel.hidden) errors.push("必须只有一个可见产品页面或业务流程概览");
        }
        for (const page of config.pages) {
          const panel = panels.find((item) => item.dataset.pagePanel === page.id);
          if (!panel || !panel.parentElement?.classList.contains("product-stage")) { errors.push(`${page.id}: 页面越出中栏`); continue; }
          if (!page.states.some((state) => state.id === panel.dataset.state)) errors.push(`${page.id}: 未声明状态`);
          if (panel.hidden || $("#app").hidden) continue;
          const rect = panel.getBoundingClientRect();
          if (Math.abs(rect.width - page.viewport.width) > 1 || Math.abs(rect.height - page.viewport.height) > 1) errors.push(`${page.id}: 产品画布尺寸改变`);
          const style = getComputedStyle(panel);
          if (!style.contain.includes("paint") || !style.contain.includes("layout")) errors.push(`${page.id}: 缺少页面隔离`);
          if (page.surface === "mall-admin") {
            const items = $$("[data-admin-primary] > button", panel);
            if (items.map((item) => item.textContent).join("|") !== MALL_ADMIN_MODULES.map((item) => item.label).join("|")) errors.push(`${page.id}: 一级导航清单改变`);
            for (const item of items) {
              const css = getComputedStyle(item);
              const icon = $("svg", item);
              if (!icon || icon.getBoundingClientRect().width < 15 || css.display !== "flex" || css.flexDirection !== "row" || parseFloat(css.fontSize) < 12 || item.getBoundingClientRect().height < 36) errors.push(`${page.id}: 导航密度或图标异常`);
            }
          } else if ($("[data-admin-shell]", panel)) errors.push(`${page.id}: 错用商城外壳`);
        }
        const active = panels.find((panel) => !panel.hidden);
        if (active) {
          const selected = $$("#overviewNav [aria-current='page']");
          if (active.dataset.pagePanel !== navigation.page || selected.length !== 1 || selected[0]?.dataset.pageTarget !== navigation.page || $("#notesPanel").dataset.pageId !== navigation.page) errors.push("三栏当前页面不一致");
          if (active.dataset.state !== navigation.states.get(navigation.page)) errors.push("页面状态偏离统一状态源");
          if ($("#notesTitle").textContent !== (pageById.get(navigation.page).label || navigation.page)) errors.push("右栏标题与当前页面不一致");
          const page = pageById.get(active.dataset.pagePanel);
          const state = page?.states.find((item) => item.id === active.dataset.state);
          const notes = { ...page?.notes, ...state?.notes };
          if ($("#notesResult").textContent !== (notes.result || "")) errors.push("右栏与当前状态不同步");
        }
        return { ok: errors.length === 0, errors };
      };

      $("#enterDemo").addEventListener("click", () => {
        $("#cover").hidden = true;
        $("#app").hidden = false;
        $("#prototypePanel").focus({ preventScroll: true });
      });
      $("#overviewNav").addEventListener("click", (event) => {
        if (hasBusinessFlow && event.target.closest?.("[data-business-flow-target]")) { showBusinessFlow(); return; }
        const button = event.target.closest?.("[data-page-target]");
        if (button) showPage(button.dataset.pageTarget);
      });
      $("#toggleOverview").addEventListener("click", () => setSide("overview", $("#toggleOverview").getAttribute("aria-pressed") !== "true"));
      $("#toggleNotes").addEventListener("click", () => setSide("notes", $("#toggleNotes").getAttribute("aria-pressed") !== "true"));

      hydrateIcons();
      // Hydrate inserted/replaced icons and changed names, without observing shell content.
      const iconObserver = new MutationObserver(() => {
        for (const panel of $$("[data-page-panel]")) hydrateIcons(panel);
      });
      for (const panel of $$("[data-page-panel]")) iconObserver.observe(panel, {
        childList: true, subtree: true, attributes: true, attributeFilter: ["data-demo-icon"]
      });
      if (hasBusinessFlow) showBusinessFlow();
      else showPage(config.pages[0].id);
      window.productDemo = {
        audit,
        showPage,
        setPageState,
        setSide,
        getPage: (pageId) => $("[data-page-panel=\"" + CSS.escape(pageId) + "\"]"),
        createIcon,
        hydrateIcons,
        renderMallAdminShell: typeof renderMallAdminShell === "function" ? renderMallAdminShell : () => { throw new Error("商城外壳需经脚手架组装后使用"); },
        getIconNames: () => Object.keys(DEMO_ICONS),
        getMallAdminModules: () => MALL_ADMIN_MODULES.map((item) => ({ ...item })),
        getConfig: () => config,
        getState: () => ({ state: navigation.states.get(navigation.page) || null, page: navigation.page, overview: $("#toggleOverview").getAttribute("aria-pressed") === "true", notes: $("#toggleNotes").getAttribute("aria-pressed") === "true" })
      };
    })();
  </script>
