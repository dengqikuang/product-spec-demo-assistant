            meta.append(el("span", `flow-mode ${action.mode}`, place));

          actionCell.appendChild(actionList);

          const recordCell = el("div", "business-flow-cell");

            for (const record of stage.records) {

          recordRow.appendChild(recordCell);

        board.append(processRow, actionRow, recordRow);
        section.appendChild(board);
        root.appendChild(section);
        }
        const foot = el("div", "business-flow-foot");
        foot.append(el("span", "", "先从左到右读完整流程，再在每个阶段查看动作角色、线上/线下入口与记录。"));

      if (hasBusinessFlow) renderBusinessFlow();

      const renderNotes = (pageId) => {

        const state = page?.states?.find((item) => item.id === navigation.states.get(pageId));
        const meta = { ...page?.notes, ...state?.notes };
        $("#notesPanel").dataset.pageId = pageId;

        $("#notesDescription").textContent = meta.description || "";
        $("#notesResult").textContent = meta.result || "";

        const root = $("#notesRules");

        const groups = [...(page.notes?.groups || []), ...(state?.notes?.groups || [])];

          const section = document.createElement("section");
          const heading = document.createElement("h4");
          const list = document.createElement("ul");
          heading.textContent = group.title || "业务规则";
          for (const item of group.items || []) {
            const li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
          }
          section.append(heading, list);
          root.appendChild(section);
        }
      };

      const renderBusinessFlowNotes = () => {
        const flow = config.businessFlow || {};
        $("#notesPanel").dataset.pageId = businessFlowPageId;
        $("#notesTitle").textContent = "业务流程概览";
        $("#notesDescription").textContent = flow.summary || "展示本需求所服务的端到端业务场景。";
        $("#notesResult").textContent = flow.outcome || "业务流程及结果待补充。";
        $("#notesBoundary").textContent = flow.boundary || "图中业务记录与示意数据不代表物理数据库实现。";
        const root = $("#notesRules");
        root.replaceChildren();
        const section = document.createElement("section");
        const heading = document.createElement("h4");
        const list = document.createElement("ul");
        heading.textContent = "图示说明";
        const items = [
          "横向按发生顺序呈现方案支持的完整业务流程。",
          "行为动作逐项标明触发者或执行者；线上动作标注系统/终端，线下动作标注现场或外部环节。",
          "系统留痕展示业务记录名称与示意数据；不要据此推断未确认的物理表结构。",
          ...(flow.readingRules || [])
        ];
        for (const item of items) {
          const li = document.createElement("li");
          li.textContent = item;
          list.appendChild(li);
        }
        section.append(heading, list);
        root.appendChild(section);
      };

      const showBusinessFlow = () => {
        if (!hasBusinessFlow) return;
        navigation.page = businessFlowPageId;
        $("#businessFlowPanel").hidden = false;
        for (const panel of $$("[data-page-panel]")) panel.hidden = true;
        for (const button of $$("#overviewNav [data-page-target]")) button.setAttribute("aria-current", "false");
        businessFlowButton.setAttribute("aria-current", "page");
        renderBusinessFlowNotes();
        $("#prototypeContent").scrollTo(0, 0);
      };

      const showPage = (pageId) => {
        if (!pageById.has(pageId)) throw new Error(`未知页面：${pageId}`);
        navigation.page = pageId;
        $("#businessFlowPanel").hidden = true;
        for (const panel of $$("[data-page-panel]")) panel.hidden = panel.dataset.pagePanel !== navigation.page;
        businessFlowButton?.setAttribute("aria-current", "false");
        for (const button of $$("[data-page-target]")) button.setAttribute("aria-current", button.dataset.pageTarget === pageId ? "page" : "false");
        renderNotes(pageId);
        $("#prototypeContent").scrollTo(0, 0);
      };
      const setSide = (side, visible) => {
        const isOverview = side === "overview";
        const button = $(isOverview ? "#toggleOverview" : "#toggleNotes");
        $("#app").classList.toggle(isOverview ? "hide-overview" : "hide-notes", !visible);
        button.setAttribute("aria-pressed", String(visible));
        button.textContent = `${isOverview ? "概述" : "说明"}：${visible ? "显示" : "隐藏"}`;
      };
      const setPageState = (pageId, stateId) => {

        if (!page?.states?.some((state) => state.id === stateId)) throw new Error(`未声明的页面状态：${pageId}/${stateId}`);

        if (navigation.page === pageId) renderNotes(pageId);
      };
      // Runtime checks complement source checks: CSS and dynamically-created DOM matter too.
      const audit = () => {

        const panels = $$("[data-page-panel]");

        for (const panel of panels) {
          hydrateIcons(panel);
          for (const host of $$("[data-demo-icon]", panel)) {
            if (host.dataset.iconError || !host.querySelector("svg.demo-icon path")) errors.push(`${panel.dataset.pagePanel}: 图标缺失或未知 ${host.dataset.demoIcon}`);

          for (const button of $$("button", panel)) {

          }
        }
        for (const id of requiredIds) if (document.querySelectorAll(`[id="${id}"]`).length !== 1) errors.push(`外框 ID 重复或缺失: ${id}`);

        const visiblePanels = panels.filter((panel) => !panel.hidden);

          if (visiblePanels.length || flowPanel.hidden) errors.push("业务流程概览必须独占中栏");

          if (selected.length !== 1 || selected[0] !== businessFlowButton || $("#notesPanel").dataset.pageId !== businessFlowPageId || $("#notesTitle").textContent !== "业务流程概览") errors.push("业务流程概览三栏导航或说明未同步");
        } else {
          if (visiblePanels.length !== 1 || !flowPanel.hidden) errors.push("必须只有一个可见产品页面或业务流程概览");
        }
        for (const page of config.pages) {
          const panel = panels.find((item) => item.dataset.pagePanel === page.id);
          if (!panel || !panel.parentElement?.classList.contains("product-stage")) { errors.push(`${page.id}: 页面越出中栏`); continue; }
          if (!page.states.some((state) => state.id === panel.dataset.state)) errors.push(`${page.id}: 未声明状态`);
          if (panel.hidden || $("#app").hidden) continue;
          const rect = panel.getBoundingClientRect();
          if (Math.abs(rect.width - page.viewport.width) > 1 || Math.abs(rect.height - page.viewport.height) > 1) errors.push(`${page.id}: 产品画布尺寸改变`);
          const style = getComputedStyle(panel);
          if (!style.contain.includes("paint") || !style.contain.includes("layout")) errors.push(`${page.id}: 缺少页面隔离`);
          if (page.surface === "mall-admin") {
            const items = $$("[data-admin-primary] > button", panel);
            if (items.map((item) => item.textContent).join("|") !== MALL_ADMIN_MODULES.map((item) => item.label).join("|")) errors.push(`${page.id}: 一级导航清单改变`);
            for (const item of items) {
              const css = getComputedStyle(item);
              const icon = $("svg", item);
              if (!icon || icon.getBoundingClientRect().width < 15 || css.display !== "flex" || css.flexDirection !== "row" || parseFloat(css.fontSize) < 12 || item.getBoundingClientRect().height < 36) errors.push(`${page.id}: 导航密度或图标异常`);
            }
          } else if ($("[data-admin-shell]", panel)) errors.push(`${page.id}: 错用商城外壳`);
        }
        const active = panels.find((panel) => !panel.hidden);
        if (active) {
          const selected = $$("#overviewNav [aria-current='page']");
          if (active.dataset.pagePanel !== navigation.page || selected.length !== 1 || selected[0]?.dataset.pageTarget !== navigation.page || $("#notesPanel").dataset.pageId !== navigation.page) errors.push("三栏当前页面不一致");
          if (active.dataset.state !== navigation.states.get(navigation.page)) errors.push("页面状态偏离统一状态源");
          if ($("#notesTitle").textContent !== (pageById.get(navigation.page).label || navigation.page)) errors.push("右栏标题与当前页面不一致");
          const page = pageById.get(active.dataset.pagePanel);
          const state = page?.states.find((item) => item.id === active.dataset.state);
          const notes = { ...page?.notes, ...state?.notes };
          if ($("#notesResult").textContent !== (notes.result || "")) errors.push("右栏与当前状态不同步");
        }
        return { ok: errors.length === 0, errors };
      };

      $("#enterDemo").addEventListener("click", () => {
        $("#cover").hidden = true;
        $("#app").hidden = false;
        $("#prototypePanel").focus({ preventScroll: true });
      });
      $("#overviewNav").addEventListener("click", (event) => {
        if (hasBusinessFlow && event.target.closest?.("[data-business-flow-target]")) { showBusinessFlow(); return; }
        const button = event.target.closest?.("[data-page-target]");
        if (button) showPage(button.dataset.pageTarget);
      });
      $("#toggleOverview").addEventListener("click", () => setSide("overview", $("#toggleOverview").getAttribute("aria-pressed") !== "true"));
      $("#toggleNotes").addEventListener("click", () => setSide("notes", $("#toggleNotes").getAttribute("aria-pressed") !== "true"));

      hydrateIcons();
      // Hydrate inserted/replaced icons and changed names, without observing shell content.
      const iconObserver = new MutationObserver(() => {
        for (const panel of $$("[data-page-panel]")) hydrateIcons(panel);
      });
      for (const panel of $$("[data-page-panel]")) iconObserver.observe(panel, {
        childList: true, subtree: true, attributes: true, attributeFilter: ["data-demo-icon"]
      });
      if (hasBusinessFlow) showBusinessFlow();
      else showPage(config.pages[0].id);
      window.productDemo = {
        audit,
        showPage,
        setPageState,
        setSide,
        getPage: (pageId) => $("[data-page-panel=\"" + CSS.escape(pageId) + "\"]"),
        createIcon,
        hydrateIcons,
        renderMallAdminShell: typeof renderMallAdminShell === "function" ? renderMallAdminShell : () => { throw new Error("商城外壳需经脚手架组装后使用"); },
        getIconNames: () => Object.keys(DEMO_ICONS),
        getMallAdminModules: () => MALL_ADMIN_MODULES.map((item) => ({ ...item })),
        getConfig: () => config,
        getState: () => ({ state: navigation.states.get(navigation.page) || null, page: navigation.page, overview: $("#toggleOverview").getAttribute("aria-pressed") === "true", notes: $("#toggleNotes").getAttribute("aria-pressed") === "true" })
      };
    })();
  </script>
